:root {

* { margin: 0; padding: 0; box-sizing: border-box; }
body {

a { color: var(--brand); text-decoration: none; }
a:hover { color: var(--brand-hover); }
code { font-family: ui-monospace, "SFMono-Regular", "Consolas", monospace; background: rgba(255,255,255,0.06); padding: 2px 6px; border-radius: 4px; font-size: 0.88em; }
/* ===== AURORA BACKGROUND ===== */
.aurora { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
.aurora-blob { position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.5; mix-blend-mode: screen; will-change: transform,border-radius; }
.aurora-blob.b1 { width: 520px; height: 520px; background: radial-gradient(circle at 30% 30%, #22c55e, transparent 70%); }
.aurora-blob.b2 { width: 460px; height: 460px; background: radial-gradient(circle at 60% 40%, #0ea5e9, transparent 70%); }
.aurora-blob.b3 { width: 540px; height: 540px; background: radial-gradient(circle at 50% 50%, #8b5cf6, transparent 70%); }
.aurora-blob.b4 { width: 380px; height: 380px; background: radial-gradient(circle at 50% 50%, #f59e0b, transparent 70%); opacity: 0.35; }
@media (prefers-reduced-motion: reduce) { .aurora-blob { display: none; } }

.nav {
position: sticky; top: 0; z-index: 100;
background: rgba(10,10,10,0.55);
backdrop-filter: blur(14px) saturate(140%); -webkit-backdrop-filter: blur(14px) saturate(140%);
border-bottom: 1px solid var(--border);
}
.nav-inner {
max-width: var(--max-width); margin: 0 auto; padding: 0 24px;
height: 56px; display: flex; align-items: center; justify-content: space-between;
}
.nav-brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--text); }
.nav-logo { width: 32px; height: 32px; filter: brightness(0) invert(1); }
.nav-name { font-size: 17px; font-weight: 700; letter-spacing: -0.3px; }
.nav-actions { display: flex; align-items: center; gap: 20px; }
.nav-link { font-size: 14px; font-weight: 500; color: var(--text-secondary); text-decoration: none; transition: color .15s; }
.nav-link:hover, .nav-link.active { color: var(--text); }
.nav-btn {
padding: 8px 20px; background: var(--brand); color: #fff; border: none;
border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer;
font-family: inherit; text-decoration: none; transition: background .15s;
}
.nav-btn:hover { background: var(--brand-hover); }
.hero {
position: relative; z-index: 1; padding: 96px 24px 56px; text-align: center;
background: transparent;
}
.hero-badge {
display: inline-block; padding: 5px 14px;

.hero h1 { font-size: 48px; font-weight: 800; letter-spacing: -1.5px; line-height: 1.1; margin-bottom: 14px; }

.hero-actions { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
.btn-primary {
display: inline-flex; align-items: center; gap: 8px;
padding: 12px 28px; background: var(--brand); color: #fff; border: none;
border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer;
font-family: inherit; text-decoration: none; transition: background .15s, transform .15s;
}
.btn-primary:hover { background: var(--brand-hover); transform: translateY(-1px); }
.btn-secondary {
display: inline-flex; align-items: center; gap: 8px;
padding: 12px 28px; background: transparent; color: var(--text);
border: 1px solid var(--border-light); border-radius: 8px;
font-size: 15px; font-weight: 600; cursor: pointer; font-family: inherit;
text-decoration: none; transition: border-color .15s, background .15s;
}
.btn-secondary:hover { border-color: var(--brand); background: rgba(34,197,94,0.08); }
.section-title { text-align: center; margin-bottom: 48px; }
.section-title h2 { font-size: 30px; font-weight: 700; letter-spacing: -0.6px; margin-bottom: 10px; }
.section-title p { font-size: 15px; color: var(--text-secondary); max-width: 560px; margin: 0 auto; line-height: 1.6; }

.os-btn svg { width: 16px; height: 16px; flex-shrink: 0; fill: currentColor; }
.os-btn.active svg { fill: var(--brand); }
.file-info {

margin-bottom: 24px;

margin-bottom: 4px;

.btn-download {

gap: 10px;
width: 100%;
padding: 15px 24px;
background: var(--brand);
color: #fff;

font-size: 16px;
font-weight: 600;

.card-footer {

.footer { border-top: 1px solid var(--border); padding: 28px 24px; text-align: center; color: var(--text-muted); font-size: 13px; }
.footer a { color: var(--text-secondary); text-decoration: none; margin: 0 6px; }

@media (max-width: 860px) { .hero h1 { font-size: 36px; } .hero { padding: 72px 20px 56px; } .download-section { padding: 56px 20px; } .download-card { padding: 28px 20px 24px; } }
@media (max-width: 520px) { .hero h1 { font-size: 30px; letter-spacing: -1px; } .nav-name { display: none; } .hero-actions { flex-direction: column; align-items: center; } }

<script>
(function() {
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var blobs = [].slice.call(document.querySelectorAll('.aurora-blob'));
  if (!blobs.length) return;
  var W = window.innerWidth, H = window.innerHeight;

  function rand(min, max) { return Math.random() * (max - min) + min; }

  var states = blobs.map(function(el) {
    return {
      el: el,
      x: rand(0, W), y: rand(0, H),
      tx: rand(0, W), ty: rand(0, H),
      scale: rand(0.8, 1.3), ts: rand(0.8, 1.4),
      rot: rand(0, 360), tr: rand(0, 360),
      br1: 50, br2: 50, tbr1: rand(30, 70), tbr2: rand(30, 70),
      next: rand(2000, 5000), acc: 0
    };
  });

  function newTarget(s) {
    s.tx = rand(-s.el.offsetWidth * 0.3, W - s.el.offsetWidth * 0.3);
    s.ty = rand(-s.el.offsetHeight * 0.3, H - s.el.offsetHeight * 0.3);
    s.ts = rand(0.7, 1.5);
    s.tr = rand(0, 360);
    s.tbr1 = rand(20, 80);
    s.tbr2 = rand(20, 80);
    s.next = rand(2500, 6000);
  }

  var last = performance.now();

  function tick(now) {
    var dt = now - last;
    last = now;
    var k = Math.min(0.04, dt / 1000 * 0.6);

    for (var i = 0; i < states.length; i++) {
      var s = states[i];
      s.x += (s.tx - s.x) * k;
      s.y += (s.ty - s.y) * k;
      s.scale += (s.ts - s.scale) * k;
      s.rot += (s.tr - s.rot) * k;
      s.br1 += (s.tbr1 - s.br1) * k;
      s.br2 += (s.tbr2 - s.br2) * k;

      s.el.style.transform = 'translate(' + s.x.toFixed(1) + 'px,' + s.y.toFixed(1) + 'px) scale(' + s.scale.toFixed(3) + ') rotate(' + s.rot.toFixed(1) + 'deg)';
      s.el.style.borderRadius = s.br1.toFixed(1) + '% ' + (100 - s.br1).toFixed(1) + '% ' + s.br2.toFixed(1) + '% ' + (100 - s.br2).toFixed(1) + '% / ' + s.br2.toFixed(1) + '% ' + s.br1.toFixed(1) + '% ' + (100 - s.br1).toFixed(1) + '% ' + (100 - s.br2).toFixed(1) + '%';

      s.acc += dt;
      if (s.acc > s.next) { newTarget(s); s.acc = 0; }
    }
    requestAnimationFrame(tick);
  }
  states.forEach(newTarget);
  requestAnimationFrame(tick);

  window.addEventListener('resize', function() {
    W = window.innerWidth; H = window.innerHeight;
  });
})();
</script>
