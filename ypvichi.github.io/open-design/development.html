<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Open Design 开发指南</title>
<style>
:root{--bg:#f6f7f9;--card-bg:#fff;--border:#e2e6ea;--text:#1f2328;--text-muted:#57606a;--accent:#0969da;--accent-soft:#ddf4ff;--section-bg:#f0f3f6;--code-bg:#f6f8fa}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);line-height:1.6;height:100vh;overflow:hidden}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
.shell{display:grid;grid-template-rows:44px 1fr;height:100vh}
.topnav{position:sticky;top:0;z-index:50;background:var(--card-bg);border-bottom:1px solid var(--border);padding:0 20px;display:flex;align-items:center;justify-content:space-between;height:44px}
.topnav .topnav-brand{font-size:14px;font-weight:600;color:var(--text);text-decoration:none}
.topnav nav{display:flex;gap:4px}
.topnav nav a{padding:5px 12px;border-radius:6px;font-size:13px;color:var(--text-muted);text-decoration:none}
.topnav nav a:hover{background:var(--accent-soft);color:var(--accent)}
.topnav nav a.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.body{display:grid;grid-template-columns:240px 1fr;min-height:0;overflow:hidden}
.sidenav{background:var(--card-bg);border-right:1px solid var(--border);padding:16px 12px;overflow-y:auto}
.sidenav .nav-title{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--text-muted);padding:4px 10px;margin:0 0 8px}
.sidenav nav a{display:flex;flex-direction:column;padding:10px 12px;border-radius:8px;color:var(--text);text-decoration:none;margin:2px 0;border:1px solid transparent;transition:background .12s,border-color .12s}
.sidenav nav a:hover{background:var(--accent-soft)}
.sidenav nav a.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.sidenav nav a .lbl{font-size:14px;font-weight:600}
.sidenav nav a .sub{font-size:11px;color:var(--text-muted);font-family:ui-monospace,"SFMono-Regular","Consolas",monospace;margin-top:2px}
.sidenav nav a.active .sub{color:var(--accent)}
.frame-wrap{position:relative;min-width:0;overflow:hidden;background:var(--bg)}
iframe{width:100%;height:100%;border:0;display:block;background:var(--bg)}
@media(max-width:640px){.body{grid-template-columns:1fr}.sidenav{display:none}.topnav nav a{padding:5px 8px;font-size:12px}}
</style></head><body>
<div class="shell">
<div class="topnav"><a class="topnav-brand" href="index.html">Open Design</a><nav><a href="index.html">首页</a><a class="active" href="development.html">开发指南</a></nav></div>
<div class="body">
<aside class="sidenav">
<p class="nav-title">契约文档</p>
<nav>
<a id="tab-arch" class="active" href="tech-architecture.html" data-tab="arch">
<span class="lbl">技术架构图</span>
<span class="sub">tech-architecture.html</span>
</a>
<a id="tab-api" href="api-schema.html" data-tab="api">
<span class="lbl">接口设计文档</span>
<span class="sub">api-schema.html</span>
</a>
<a id="tab-db" href="database-schema.html" data-tab="db">
<span class="lbl">数据库表结构</span>
<span class="sub">database-schema.html</span>
</a>
<a id="tab-platform" href="platformization.html" data-tab="platform">
<span class="lbl">平台化改造方案</span>
<span class="sub">platformization.html</span>
</a>
</nav>
</aside>
<div class="frame-wrap">
<iframe id="docframe" name="docframe" src="tech-architecture.html" title="文档内容"></iframe>
</div>
</div>
</div>
<script>
(function(){
  var links=document.querySelectorAll('.sidenav nav a');
  var frame=document.getElementById('docframe');

  function selectTab(a){
    links.forEach(function(x){x.classList.remove('active')});
    a.classList.add('active');
    frame.src=a.getAttribute('href');
  }

  links.forEach(function(a){
    a.addEventListener('click',function(e){
      e.preventDefault();
      var tab=a.getAttribute('data-tab');
      if(tab){location.hash=tab;}
      selectTab(a);
    });
  });

  function restoreFromHash(){
    var hash=(location.hash||'').replace(/^#/,'');
    if(!hash){return false;}
    for(var i=0;i<links.length;i++){
      if(links[i].getAttribute('data-tab')===hash){
        selectTab(links[i]);
        return true;
      }
    }
    return false;
  }

  if(!restoreFromHash()){
    var active=document.querySelector('.sidenav nav a.active');
    if(active){frame.src=active.getAttribute('href');}
  }

  window.addEventListener('hashchange',restoreFromHash);
})();
</script>
</body></html>
